name: Set up desktop build
description: Install the pinned runtime, native build prerequisites and voice cache.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool gfortran pkg-config libopenblas-pthread-dev liblapacke-dev libgtk-3-0t64 libnss3 libgbm1 libasound2t64 xvfb xauth pkexec dpkg-dev ffmpeg
        echo "PKG_CONFIG_PATH=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/openblas-pthread/pkgconfig" >> "$GITHUB_ENV"
        sudo chown root:root node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
    - if: runner.os == 'macOS'
      run: brew install autoconf automake libtool
      shell: bash
    - if: runner.os != 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/astra-voice
        key: voice-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-voice.ts', 'src/vosk.ts', '.github/actions/setup-desktop/action.yml') }}
    - if: runner.os == 'Windows'
      id: windows
      shell: bash
      run: bun -e 'import { VOSK_VERSION } from "./src/vosk"; await Bun.write(process.env.GITHUB_OUTPUT, "path=node_modules/.cache/astra-voice/"+VOSK_VERSION+"-win32-x64/assets\n");'
    - if: runner.os == 'Windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.windows.outputs.path }}
        key: windows-voice-${{ hashFiles('scripts/build-voice-windows.ts', 'native/VoskWindows.Dockerfile', 'src/vosk.ts') }}
        enableCrossOsArchive: true
        fail-on-cache-miss: true
