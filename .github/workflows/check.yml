name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: brew install autoconf automake libtool
      - run: bun run build
      - name: Run software tests (microphone capture requires hardware)
        run: bun test --test-name-pattern '^(?!native capture isolates microphone channels)'
      - run: bun run build:web
        env:
          ASTRA_REMOTE_URL: https://astra-backend.example.com
      - run: bun run build:site
      - run: bun audit
